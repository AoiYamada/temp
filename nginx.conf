# Cache policy per URI. Vite fingerprints js/css/fonts it emits under /assets/,
# but public/assets/ (images) shares that directory and is not fingerprinted,
# so only fingerprinted file names are cached as immutable.
map $uri $cache_control {
    default                                        "";
    /index.html                                    "no-cache";
    "~^/assets/.+-[\w-]{8}\.(?:js|css|woff2?)$"    "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # No location-level add_header: it would replace these instead of adding.
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A missing asset must 404: answering with index.html would hand a stale
    # tab HTML in place of the old bundle it asked for.
    location /assets/ {
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to the entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
